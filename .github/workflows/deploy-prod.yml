name: Deploy (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod-parks-server
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          REPO="${REGISTRY}/${IMAGE_NAME}"
          REPO_LOWER="${REPO,,}"
          echo "image=${REPO_LOWER}:prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_prod=${REPO_LOWER}:prod" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_prod }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          passphrase: ${{ secrets.VDS_SSH_KEY_PASSPHRASE }}
          script: |
            set -e
            cd /opt/apps/parks-server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE="${{ needs.build-and-push.outputs.image }}"
            docker compose -f docker-compose.yml --env-file .env pull app temporal-schedule
            docker compose -f docker-compose.yml --env-file .env up -d --remove-orphans postgres app
            docker compose -f docker-compose.yml --env-file .env run --rm temporal-schedule
            docker image prune -f
